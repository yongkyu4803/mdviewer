name: Signed release candidate
on:
  workflow_dispatch:
    inputs:
      runtime_tests_passed:
        description: macOS and Windows runtime checklists passed for this commit
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # Tests and audits install and run third-party tools. They run in a separate
  # job without the release environment, so nothing they leave on a runner can
  # observe signing credentials.
  verify:
    if: github.ref == 'refs/heads/main' && inputs.runtime_tests_passed
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python scripts/audit-rust.py
  signed:
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.runtime_tests_passed
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # No dependency lifecycle scripts run on the signing runner. The build
      # needs none: only optional core-js and fsevents declare install scripts.
      - run: npm ci --ignore-scripts
      - name: Sign and notarize macOS bundle
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/check-signing-env.mjs macos
          npm run desktop:build -- --bundles dmg
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/Mark_md.app
          spctl --assess --type execute src-tauri/target/release/bundle/macos/Mark_md.app
          xcrun stapler validate src-tauri/target/release/bundle/macos/Mark_md.app
      - name: Sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          node scripts/check-signing-env.mjs windows
          if ($LASTEXITCODE -ne 0) { throw 'Missing signing configuration' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'markmd.pfx'
          $configPath = Join-Path $env:RUNNER_TEMP 'markmd-signing.json'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $signers = @($imported | Where-Object { $_.HasPrivateKey })
            if ($signers.Count -ne 1) { throw 'Exactly one signing private key is required' }
            $certificate = $signers[0]
            @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $env:WINDOWS_TIMESTAMP_URL; tsp = $true } } } | ConvertTo-Json -Depth 5 | Set-Content $configPath
            npm run desktop:build:windows -- --config $configPath
            if ($LASTEXITCODE -ne 0) { throw 'Signed build failed' }
            $files = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
            $files += Get-Item src-tauri/target/x86_64-pc-windows-msvc/release/Mark_md.exe
            foreach ($file in $files) {
              $signature = Get-AuthenticodeSignature $file.FullName
              if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) { throw "Invalid or untimestamped signature: $($file.Name)" }
            }
          } finally {
            Remove-Item $certificatePath, $configPath -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Mark_md-signed-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
